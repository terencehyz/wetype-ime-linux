name: AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libfcitx5core-dev patchelf binutils file \
            zlib1g-dev python3 unzip curl ca-certificates

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'   # no FUSE on the runner
        run: |
          scripts/e2_img.sh
          sha256sum WeTypeIME-Engine-aarch64.AppImage > WeTypeIME-Engine-aarch64.AppImage.sha256
          cat WeTypeIME-Engine-aarch64.AppImage.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WeTypeIME-Engine-aarch64
          path: |
            WeTypeIME-Engine-aarch64.AppImage
            WeTypeIME-Engine-aarch64.AppImage.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            WeTypeIME-Engine-aarch64.AppImage WeTypeIME-Engine-aarch64.AppImage.sha256
